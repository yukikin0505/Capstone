[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "Minimal simulation of objective-driven decentralized autonomy for UAS swarms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yuki Kin" },
  { name = "Maria Vlahos" },
  { name = "Leonard Wang" },
]
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
swarm-sim = "swarm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
